<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>科技新闻列表 · 知乎制作和模仿</title>
  <link rel="stylesheet" href="css/Guoyanb_common.css" />
  <link rel="stylesheet" href="css/Guoyanb_list.css" />
</head>
<body>
  <canvas id="Guoyanb_bg_canvas"></canvas>

  <div class="Guoyanb_container">
    <div class="Guoyanb_topbar">
      <a class="Guoyanb_back_link" href="index.html">← 返回首页</a>
    </div>

    <div class="Guoyanb_list_head">
      <h1>📰 科技新闻列表</h1>
      <p>新闻数据存储于 MySQL 数据库，通过后端 RESTful 接口获取并渲染</p>
    </div>

    <!-- 后端接口链接 -->
    <div class="Guoyanb_endpoint">
      <span class="Guoyanb_method">GET</span>
      <code>http://localhost:8201/api/news</code>
      <a href="http://localhost:8201/api/news" target="_blank" rel="noopener">查看原始 JSON</a>
    </div>

    <!-- 加载状态 / 数据内容 -->
    <div id="Guoyanb_news_box">
      <div class="Guoyanb_status">正在加载新闻数据...</div>
    </div>
  </div>

  <script src="js/Guoyanb_canvas.js"></script>
  <script src="js/Guoyanb_news.js"></script>
</body>
</html>
